<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Illustration générique d'un flacon de parfum</title>
  <desc id="desc">Illustration neutre, non contractuelle, sans marque ni photo de stock.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f7f4ef"/>
      <stop offset="1" stop-color="#e9e1d7"/>
    </linearGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d8c5b4" stop-opacity=".7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#background)"/>
  <circle cx="320" cy="304" r="234" fill="#ffffff" opacity=".36"/>
  <ellipse cx="320" cy="525" rx="150" ry="20" fill="#837668" opacity=".18"/>
  <rect x="275" y="128" width="90" height="64" rx="8" fill="#4b4742"/>
  <rect x="263" y="182" width="114" height="26" rx="7" fill="#8f8274"/>
  <rect x="171" y="206" width="298" height="295" rx="58" fill="url(#glass)" stroke="#8f8274" stroke-width="8"/>
  <rect x="205" y="245" width="230" height="218" rx="34" fill="#e4c8ae" opacity=".55"/>
  <path d="M206 300c52 19 176 19 228 0" fill="none" stroke="#fff" stroke-width="9" opacity=".6"/>
  <rect x="238" y="338" width="164" height="78" rx="8" fill="#fffaf4" stroke="#cbbbaa"/>
  <text x="320" y="387" fill="#5a5148" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">33 ml</text>
</svg>
